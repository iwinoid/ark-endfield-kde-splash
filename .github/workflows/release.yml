name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build store tarball
        run: |
          bash dist.sh
          tar -tzf dist/ark-endfield-loading.tar.gz
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ark-endfield-loading.tar.gz
